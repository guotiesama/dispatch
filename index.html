<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>派单管控智能体 v13.2</title>
<script src="https://cdn.bootcdn.net/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#4f46e5;--primary-light:#6366f1;--primary-dark:#3730a3;
  --cyan:#06b6d4;--emerald:#10b981;--amber:#f59e0b;--rose:#f43f5e;
  --purple:#a855f7;--c6:#7c3aed;
  --bg:#f8fafc;--card:#fff;--text:#1e293b;--text2:#64748b;--border:#e2e8f0;
  --shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
#entryPage{position:fixed;inset:0;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;overflow:hidden}
#entryPage::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(79,70,229,.3),transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}}
.entry-title{font-size:42px;font-weight:800;background:linear-gradient(135deg,#818cf8,#06b6d4,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px;text-align:center;animation:fadeUp .8s ease}
.entry-sub{color:#94a3b8;font-size:16px;margin-bottom:48px;text-align:center;animation:fadeUp .8s ease .2s both}
.entry-cards{display:flex;gap:32px;animation:fadeUp .8s ease .4s both}
.entry-card{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:48px 40px;cursor:pointer;transition:all .3s;text-align:center;min-width:240px}
.entry-card:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);transform:translateY(-4px)}
.entry-card .icon{font-size:48px;margin-bottom:16px}
.entry-card .label{color:#e2e8f0;font-size:20px;font-weight:600}
.entry-card .desc{color:#94a3b8;font-size:13px;margin-top:8px}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
#adminPage{display:none;min-height:100vh}
.top-bar{background:linear-gradient(135deg,var(--primary),var(--c6));color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(79,70,229,.3)}
.top-bar h1{font-size:18px;font-weight:700}
.top-bar .user-info{font-size:13px;opacity:.9;cursor:pointer}
.tab-nav{background:#fff;border-bottom:1px solid var(--border);padding:0 16px;display:flex;gap:0;overflow-x:auto;position:sticky;top:56px;z-index:90}
.tab-nav::-webkit-scrollbar{height:0}
.tab-btn{padding:12px 16px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s}
.tab-btn:hover{color:var(--primary)}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab-content{padding:20px;max-width:1400px;margin:0 auto}
.tab-panel{display:none}.tab-panel.active{display:block}
.card{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px;border:1px solid var(--border)}
.card-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-title .badge{background:linear-gradient(135deg,var(--primary),var(--c6));color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#fff;border-radius:12px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.stat-card.c1::before{background:linear-gradient(90deg,var(--primary),var(--primary-light))}
.stat-card.c2::before{background:linear-gradient(90deg,var(--cyan),#22d3ee)}
.stat-card.c3::before{background:linear-gradient(90deg,var(--emerald),#34d399)}
.stat-card.c4::before{background:linear-gradient(90deg,var(--amber),#fbbf24)}
.stat-card.c5::before{background:linear-gradient(90deg,var(--rose),#fb7185)}
.stat-card.c6::before{background:linear-gradient(90deg,var(--purple),#c084fc)}
.stat-card .label{font-size:12px;color:var(--text2);margin-bottom:4px}
.stat-card .value{font-size:24px;font-weight:700}
.stat-card.c1 .value{color:var(--primary)}.stat-card.c2 .value{color:var(--cyan)}
.stat-card.c3 .value{color:var(--emerald)}.stat-card.c4 .value{color:var(--amber)}
.stat-card.c5 .value{color:var(--rose)}.stat-card.c6 .value{color:var(--purple)}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{background:#f8fafc;padding:10px 12px;text-align:left;font-weight:600;color:var(--text2);border-bottom:2px solid var(--border);white-space:nowrap}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--border)}
.data-table tr:hover td{background:#f1f5f9}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--c6));color:#fff}
.btn-primary:hover{box-shadow:0 4px 12px rgba(79,70,229,.4);transform:translateY(-1px)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-danger{background:var(--rose);color:#fff}
.btn-outline{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn-outline:hover{background:var(--primary);color:#fff}
.btn-success{background:var(--emerald);color:#fff}
.btn-cyan{background:var(--cyan);color:#fff}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:4px;color:var(--text2)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;transition:border .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:90%;max-width:700px;max-height:85vh;overflow-y:auto;box-shadow:0 25px 50px rgba(0,0,0,.15)}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px}
.chart-box{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;border:1px solid var(--border);box-shadow:var(--shadow)}
.chart-box canvas{width:100%!important;max-height:300px}
.ym-selector{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.ym-selector select{padding:6px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px}
.chk-wrap{display:inline-flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;margin:2px 4px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;transition:all .2s}
.chk-wrap:has(input:checked){background:rgba(79,70,229,.1);border-color:var(--primary)}
.chk-wrap input{accent-color:var(--primary)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.tag-emp{background:rgba(79,70,229,.1);color:var(--primary)}
.tag-dis{background:rgba(6,182,212,.1);color:var(--cyan)}
#empPage{display:none;min-height:100vh;background:var(--bg)}
.emp-header{background:linear-gradient(135deg,var(--primary),var(--c6));color:#fff;padding:20px;text-align:center}
.emp-header h2{font-size:20px;margin-bottom:4px}
.emp-tabs{display:flex;background:#fff;border-bottom:1px solid var(--border)}
.emp-tab{flex:1;padding:12px;text-align:center;font-size:14px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:var(--text2);transition:all .2s}
.emp-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.emp-body{padding:16px;max-width:600px;margin:0 auto}
.emp-panel{display:none}.emp-panel.active{display:block}
.grad-text{background:linear-gradient(135deg,var(--primary),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
.toast{position:fixed;top:70px;right:20px;background:#1e293b;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;z-index:9999;opacity:0;transform:translateX(20px);transition:all .3s}
.toast.show{opacity:1;transform:translateX(0)}
.toast.success{background:var(--emerald)}.toast.error{background:var(--rose)}
.empty{text-align:center;padding:40px 20px;color:var(--text2)}
.empty .icon{font-size:48px;margin-bottom:12px;opacity:.5}
.rank-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border)}
.rank-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.rank-1{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
.rank-2{background:linear-gradient(135deg,#94a3b8,#64748b)}
.rank-3{background:linear-gradient(135deg,#d97706,#b45309)}
.rank-other{background:#e2e8f0;color:var(--text2)}
.rank-info{flex:1}.rank-name{font-weight:600;font-size:14px}
.rank-score{font-size:13px;color:var(--text2)}
.rank-bar{height:6px;background:#f1f5f9;border-radius:3px;overflow:hidden;margin-top:4px}
.rank-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--primary),var(--cyan))}
.alloc-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.alloc-table th{background:#f1f5f9;padding:6px 8px;text-align:left;font-size:12px}
.alloc-table td{padding:6px 8px;border-bottom:1px solid var(--border)}
.alloc-table input{width:80px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;text-align:center}
.alloc-table input:focus{outline:none;border-color:var(--primary)}
@media(max-width:768px){
  .entry-cards{flex-direction:column;gap:16px}
  .entry-card{padding:32px 24px;min-width:auto}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .tab-btn{padding:10px 12px;font-size:12px}
  .tab-content{padding:12px}
  .modal{width:95%;padding:16px}
  .emp-body{padding:12px}
}
</style>
</head>
<body>
<!-- 入口页 -->
<div id="entryPage">
  <div class="entry-title">派单管控智能体</div>
  <div class="entry-sub">电信社区营销 · 数字化管控平台 v13.2</div>
  <div class="entry-cards">
    <div class="entry-card" onclick="enterAdmin()">
      <div class="icon">🛡️</div>
      <div class="label">管理员端</div>
      <div class="desc">数据管控 · 分析决策</div>
    </div>
    <div class="entry-card" onclick="enterEmp()">
      <div class="icon">📱</div>
      <div class="label">员工填报</div>
      <div class="desc">移动填报 · 历史查询</div>
    </div>
  </div>
</div>

<!-- 管理员端 -->
<div id="adminPage">
  <div class="top-bar">
    <h1>📋 派单管控智能体</h1>
    <div class="user-info" onclick="backToEntry()">返回入口</div>
  </div>
  <div class="tab-nav" id="tabNav"></div>
  <div class="tab-content" id="tabContent"></div>
</div>

<!-- 员工端 -->
<div id="empPage">
  <div class="emp-header">
    <h2 id="empTitle">员工填报</h2>
    <div id="empSubtitle" style="font-size:13px;opacity:.8"></div>
  </div>
  <div class="emp-tabs">
    <div class="emp-tab active" onclick="switchEmpTab(0)">📝 填报</div>
    <div class="emp-tab" onclick="switchEmpTab(1)">📜 历史</div>
  </div>
  <div class="emp-body" id="empBody"></div>
  <div style="text-align:center;padding:12px;cursor:pointer;color:var(--text2);font-size:13px" onclick="backToEntry()">返回入口</div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ====== 配置 ======
const SUPABASE_URL = 'https://vagtmsyzoehkakdejgkw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_O0aq7OG9x4DkuizZ-E4J6w_uuNu30gf';
const HEADERS = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
};

const PRODUCTS = [
  {key:'P_FTTR',name:'FTTR'},{key:'P_ACAP',name:'ACAP'},{key:'P_ZP',name:'中屏'},
  {key:'P_BZQG',name:'标准迁改'},{key:'P_ZDYQG',name:'自定义迁改'},
  {key:'P_JZ10U',name:'加装10元以上'},{key:'P_JZ10',name:'加装10元'},{key:'P_TD',name:'托底'}
];

const TABS = [
  {id:'employees',label:'👥 员工管理'},
  {id:'dispatches',label:'📋 派单管理'},
  {id:'products',label:'⭐ 重点业务'},
  {id:'groups',label:'🏷️ 人员分组'},
  {id:'dashboard',label:'📊 总看板'},
  {id:'analysis',label:'🔬 人员分析'},
  {id:'ranks',label:'🏆 业绩排行'},
  {id:'qrentry',label:'🔗 填报入口'},
  {id:'export',label:'📥 数据导出'}
];

// ====== 状态 ======
let state = {
  employees: [],
  dispatches: [],
  products: PRODUCTS.map(p=>({...p})),
  groups: [],
  submissions: [],
  activeTab: 'employees',
  dashYear: new Date().getFullYear(),
  dashMonth: new Date().getMonth() + 1,
  empId: '',
  empName: ''
};

// ====== Supabase API ======
async function apiGet(table, query='') {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`, {headers: HEADERS});
  if(!r.ok) throw new Error(`API ${table}: ${r.status}`);
  return r.json();
}
async function apiPost(table, data) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method:'POST', headers: HEADERS, body: JSON.stringify(data)
  });
  if(!r.ok && r.status!==409) throw new Error(`POST ${table}: ${r.status}`);
  return r.status===409 ? null : r.json();
}
async function apiPatch(table, id, data) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
    method:'PATCH', headers: {...HEADERS, 'Prefer':'return=representation'}, body: JSON.stringify(data)
  });
  if(!r.ok) throw new Error(`PATCH ${table}: ${r.status}`);
  return r.json();
}
async function apiDelete(table, id) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
    method:'DELETE', headers: HEADERS
  });
  if(!r.ok) throw new Error(`DELETE ${table}: ${r.status}`);
}

// ====== 数据加载 ======
async function loadConfig() {
  try {
    const rows = await apiGet('dispatch_config','?select=id,key,data');
    rows.forEach(r => {
      if(r.key === 'employees') state.employees = r.data || [];
      if(r.key === 'dispatches') state.dispatches = r.data || [];
      if(r.key === 'products' && r.data && r.data.length) state.products = r.data;
      if(r.key === 'groups') state.groups = r.data || [];
    });
  } catch(e) { console.warn('加载配置失败:', e); }
}
async function loadSubmissions() {
  try {
    state.submissions = await apiGet('dispatch_submissions','?select=*&order=created_at.desc');
  } catch(e) { console.warn('加载填报失败:', e); state.submissions = []; }
  return state.submissions;
}
async function saveConfig(key, data) {
  try {
    const rows = await apiGet('dispatch_config',`?key=eq.${key}`);
    if(rows.length) await apiPatch('dispatch_config', rows[0].id, {data: data});
    else await apiPost('dispatch_config', {key: key, data: data});
  } catch(e) { console.error('保存配置失败:', e); }
}

// ====== 工具 ======
function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 2500);
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }
function openModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}
function findEmp(query) {
  const q = query.trim().toLowerCase();
  return state.employees.find(e => e.id.toLowerCase() === q || e.name === query.trim());
}

// ====== 入口 ======
function enterAdmin() {
  document.getElementById('entryPage').style.display = 'none';
  document.getElementById('adminPage').style.display = 'block';
  initAdmin();
}
function enterEmp() {
  const hash = location.hash;
  if(hash.startsWith('#emp=')) state.empId = hash.substring(5);
  document.getElementById('entryPage').style.display = 'none';
  document.getElementById('empPage').style.display = 'block';
  initEmp();
}
function backToEntry() {
  document.getElementById('adminPage').style.display = 'none';
  document.getElementById('empPage').style.display = 'none';
  document.getElementById('entryPage').style.display = 'flex';
}

// ====== 管理员端 ======
async function initAdmin() {
  await loadConfig();
  await loadSubmissions();
  renderTabNav();
  switchTab(state.activeTab);
  setInterval(async () => {
    await loadSubmissions();
    if(state.activeTab === 'dashboard') renderDashboard();
    if(state.activeTab === 'ranks') renderRanks();
  }, 15000);
}
function renderTabNav() {
  const nav = document.getElementById('tabNav');
  nav.innerHTML = TABS.map(t =>
    `<div class="tab-btn ${t.id===state.activeTab?'active':''}" onclick="switchTab('${t.id}')">${t.label}</div>`
  ).join('');
}
function switchTab(id) {
  state.activeTab = id;
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', TABS[i].id === id);
  });
  const ct = document.getElementById('tabContent');
  ct.innerHTML = '<div class="tab-panel active" id="panel_'+id+'"></div>';
  const renderers = {
    employees:renderEmployees, dispatches:renderDispatches, products:renderProducts,
    groups:renderGroups, dashboard:renderDashboard, analysis:renderAnalysis,
    ranks:renderRanks, qrentry:renderQrEntry, export:renderExport
  };
  if(renderers[id]) renderers[id]();
}

// ====== 员工管理 ======
function renderEmployees() {
  const p = document.getElementById('panel_employees');
  let html = `<div class="card">
    <div class="card-title">👥 员工管理 <span class="badge">${state.employees.length}人</span></div>
    <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="addEmployee()">➕ 添加员工</button>
      <button class="btn btn-outline" onclick="batchImport()">📦 批量导入</button>
    </div>
    <div style="overflow-x:auto">
    <table class="data-table"><thead><tr><th>工号</th><th>姓名</th><th>分组</th><th>操作</th></tr></thead><tbody>`;
  state.employees.forEach((e,i) => {
    html += `<tr><td>${e.id}</td><td>${e.name}</td><td><span class="tag tag-dis">${e.group||'未分组'}</span></td>
      <td><button class="btn btn-sm btn-outline" onclick="editEmployee(${i})">编辑</button>
      <button class="btn btn-sm btn-danger" onclick="delEmployee(${i})">删除</button></td></tr>`;
  });
  if(!state.employees.length) html += '<tr><td colspan="4" class="empty">暂无员工数据</td></tr>';
  html += '</tbody></table></div></div>';
  p.innerHTML = html;
}
function addEmployee() {
  openModal(`<div class="modal-title">添加员工</div>
    <div class="form-group"><label>工号</label><input id="mEmpId" placeholder="如 E01"></div>
    <div class="form-group"><label>姓名</label><input id="mEmpName" placeholder="姓名"></div>
    <div class="form-group"><label>分组</label><select id="mEmpGroup"><option value="">未分组</option>
      ${state.groups.map(g=>'<option value="'+g.name+'">'+g.name+'</option>').join('')}</select></div>
    <div style="text-align:right;margin-top:16px">
      <button class="btn btn-primary" onclick="saveEmployee()">保存</button>
      <button class="btn btn-outline" onclick="closeModal()" style="margin-left:8px">取消</button>
    </div>`);
}
function saveEmployee() {
  const id = document.getElementById('mEmpId').value.trim();
  const name = document.getElementById('mEmpName').value.trim();
  const group = document.getElementById('mEmpGroup').value;
  if(!id || !name) return toast('请填写工号和姓名','error');
  if(state.employees.find(e=>e.id.toLowerCase()===id.toLowerCase())) return toast('工号已存在','error');
  state.employees.push({id, name, group: group||''});
  saveConfig('employees', state.employees).then(()=>{closeModal();renderEmployees();toast('添加成功','success');});
}

    <div style="text-align:right;margin-top:16px">

    </div>`);

function updateEmployee(i) {

  state.employees[i].group = document.getElementById('mEmpGroup').value;
  saveConfig('employees', state.employees).then(()=>{closeModal();renderEmployees();toast('已更新','success');});
}
function delEmployee(i) {

  state.employees.splice(i,1);
  saveConfig('employees', state.employees).then(()=>{renderEmployees();toast('已删除','success');});
}
function batchImport() {
  openModal(`<div class="modal-title">批量导入员工</div>
    <div class="form-group"><label>粘贴员工数据（每行一条，格式：工号,姓名,分组）</label>
    <textarea id="mBatchText" rows="8" placeholder="E01,张三,A组&#10;E02,李四,B组"></textarea></div>
    <div class="form-group"><label>或上传CSV文件</label><input type="file" id="mBatchFile" accept=".csv,.txt" onchange="readCSV(this)"></div>
    <div style="text-align:right;margin-top:16px">
      <button class="btn btn-primary" onclick="doBatchImport()">导入</button>
      <button class="btn btn-outline" onclick="closeModal()" style="margin-left:8px">取消</button>
    </div>`);
}
function readCSV(input) {
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => { document.getElementById('mBatchText').value = e.target.result; };
  reader.readAsText(file);
}
function doBatchImport() {
  const text = document.getElementById('mBatchText').value.trim();
  if(!text) return toast('请输入数据','error');
  const lines = text.split('\n').filter(l=>l.trim());
  let count = 0;
  lines.forEach(line => {
    const parts = line.split(/[,，\t]/).map(s=>s.trim());
    if(parts.length >= 2) {
      const id = parts[0], name = parts[1], group = parts[2]||'';
      if(!state.employees.find(e=>e.id.toLowerCase()===id.toLowerCase())) {
        state.employees.push({id, name, group});
        count++;
      }
    }
  });
  saveConfig('employees', state.employees).then(()=>{closeModal();renderEmployees();toast(`成功导入${count}人`,'success');});
}

function renderDispatches() {
  const p = document.getElementById('panel_dispatches');
  let html = `<div class="card">
    <div class="card-title">📋 派单管理 <span class="badge">${state.dispatches.length}个</span></div>

    </tr></thead><tbody>`;
  state.dispatches.forEach((d,i) => {
    const alloc = d.allocations || [];
    const totalAlloc = alloc.reduce((s,a)=>s+(Number(a.pdl)||0),0);

function addDispatch() {
  const empCheckboxes = state.employees.map(e =>
    `<label class="chk-wrap"><input type="checkbox" value="${e.id}" class="dis-emp-chk" onchange="onDisEmpCheck()">${e.name}(${e.id})</label>`
  ).join('');

  openModal(`<div class="modal-title">新建派单</div>
    <div class="form-group"><label>派单名称</label><input id="mDisName" placeholder="如 7月社区营销"></div>
    <div class="form-group"><label>总派单量</label><input type="number" id="mDisTotalPdl" inputmode="numeric" value="0" min="0" placeholder="输入总派单量" oninput="onDisEmpCheck()"></div>

      <div style="margin-top:4px"><label style="cursor:pointer"><input type="checkbox" onchange="toggleAllEmps(this)"> 全选</label></div>

    </div>`);
}

function toggleAllEmps(el) {
  document.querySelectorAll('.dis-emp-chk').forEach(c => c.checked = el.checked);
  onDisEmpCheck();
}

function onDisEmpCheck() {
  onAllocModeChange();
}

function onAllocModeChange() {
  const mode = document.querySelector('input[name="allocMode"]:checked')?.value || 'avg';
  const totalPdl = Number(document.getElementById('mDisTotalPdl')?.value) || 0;
  const checked = [...document.querySelectorAll('.dis-emp-chk:checked')];
  const preview = document.getElementById('allocPreview');
  if(!preview) return;

  if(!checked.length) {
    preview.innerHTML = '<div style="color:var(--text2);font-size:13px;padding:8px">请选择员工</div>';
    return;
  }

  let html = `<div style="margin-top:8px;border-top:1px solid var(--border);padding-top:12px">
    <div style="font-weight:600;margin-bottom:8px">分配明细 <span class="tag tag-dis">总派单量: ${totalPdl}</span></div>
    <table class="alloc-table"><thead><tr><th>员工</th><th>分配派单量</th></tr></thead><tbody>`;

  if(mode === 'avg') {
    const each = Math.floor(totalPdl / checked.length);
    const remainder = totalPdl - each * checked.length;
    checked.forEach((c, i) => {
      const emp = state.employees.find(e=>e.id===c.value);
      const val = each + (i < remainder ? 1 : 0);
      html += `<tr><td>${emp?emp.name:c.value}</td><td style="text-align:center;font-weight:600">${val}</td></tr>`;
    });
  } else {
    checked.forEach((c, i) => {
      const emp = state.employees.find(e=>e.id===c.value);
      html += `<tr><td>${emp?emp.name:c.value}</td>
        <td><input type="number" class="alloc-input" data-emp-id="${c.value}" inputmode="numeric" value="0" min="0" onchange="updateAllocSum()"></td></tr>`;
    });
  }

  html += '</tbody></table>';
  if(mode === 'manual') {
    html += `<div id="allocSum" style="margin-top:8px;font-size:13px;color:var(--text2)">已分配: 0 / ${totalPdl}</div>`;
  }
  html += '</div>';
  preview.innerHTML = html;
}

function updateAllocSum() {
  const totalPdl = Number(document.getElementById('mDisTotalPdl')?.value) || 0;
  const inputs = document.querySelectorAll('.alloc-input');
  let sum = 0;
  inputs.forEach(inp => { sum += Number(inp.value) || 0; });
  const sumEl = document.getElementById('allocSum');
  if(sumEl) {
    const color = sum !== totalPdl ? 'var(--rose)' : 'var(--emerald)';
    sumEl.innerHTML = `<span style="color:${color};font-weight:600">已分配: ${sum} / ${totalPdl}</span>${sum !== totalPdl ? ' <span style="color:var(--rose)">（不等于总派单量）</span>':''}`;
  }
}

function saveDispatch() {
  const name = document.getElementById('mDisName').value.trim();
  const totalPdl = Number(document.getElementById('mDisTotalPdl').value) || 0;
  if(!name) return toast('请输入派单名称','error');
  const checked = [...document.querySelectorAll('.dis-emp-chk:checked')];
  if(!checked.length) return toast('请选择分配员工','error');

  const mode = document.querySelector('input[name="allocMode"]:checked')?.value || 'avg';
  const allocations = [];

  if(mode === 'avg') {
    const each = Math.floor(totalPdl / checked.length);
    const remainder = totalPdl - each * checked.length;
    checked.forEach((c, i) => {
      allocations.push({
        empId: c.value,
        pdl: each + (i < remainder ? 1 : 0)
      });
    });
  } else {
    let sum = 0;
    document.querySelectorAll('.alloc-input').forEach(inp => {
      const val = Number(inp.value) || 0;
      sum += val;
      allocations.push({ empId: inp.dataset.empId, pdl: val });
    });
    if(sum !== totalPdl) {
      if(!confirm(`已分配合计${sum}，与总派单量${totalPdl}不一致，仍要保存吗？`)) return;
    }
  }

  state.dispatches.push({name, total_pdl: totalPdl, allocations});
  saveConfig('dispatches', state.dispatches).then(()=>{closeModal();renderDispatches();toast('创建成功','success');});
}

function editDispatch(i) {
  const d = state.dispatches[i];
  const empCheckboxes = state.employees.map(e => {
    const alloc = (d.allocations||[]).find(a=>a.empId===e.id);
    return `<label class="chk-wrap"><input type="checkbox" value="${e.id}" class="dis-emp-chk" ${alloc?'checked':''} onchange="onDisEmpCheck()">${e.name}(${e.id})</label>`;
  }).join('');

  openModal(`<div class="modal-title">编辑派单</div>
    <div class="form-group"><label>派单名称</label><input id="mDisName" value="${d.name}"></div>
    <div class="form-group"><label>总派单量</label><input type="number" id="mDisTotalPdl" inputmode="numeric" value="${d.total_pdl||0}" min="0" oninput="onDisEmpCheck()"></div>
    <div class="form-group"><label>分配员工</label>
      <div style="margin-top:4px"><label style="cursor:pointer"><input type="checkbox" onchange="toggleAllEmps(this)"> 全选</label></div>
      <div id="mDisEmps" style="margin-top:4px">${empCheckboxes}</div>
    </div>
    <div class="form-group">
      <label>分配方式</label>
      <div style="display:flex;gap:8px;margin-top:4px">
        <label style="cursor:pointer"><input type="radio" name="allocMode" value="avg" checked onchange="onAllocModeChange()"> 平均分配</label>
        <label style="cursor:pointer"><input type="radio" name="allocMode" value="manual" onchange="onAllocModeChange()"> 手动分配</label>
      </div>
    </div>
    <div id="allocPreview"></div>
    <div style="text-align:right;margin-top:16px">
      <button class="btn btn-primary" onclick="updateDispatch(${i})">保存</button>
      <button class="btn btn-outline" onclick="closeModal()" style="margin-left:8px">取消</button>
    </div>`);

  // 延迟设置手动分配初始值
  setTimeout(() => {
    if(d.allocations && d.allocations.length) {
      // 先触发一次渲染
      onAllocModeChange();
      // 如果有已存分配，切到手动模式并填值
      setTimeout(() => {
        const manualRadio = document.querySelector('input[name="allocMode"][value="manual"]');
        if(manualRadio) { manualRadio.checked = true; onAllocModeChange(); }
        setTimeout(() => {
          d.allocations.forEach(a => {
            const inp = document.querySelector(`.alloc-input[data-emp-id="${a.empId}"]`);
            if(inp) inp.value = a.pdl || 0;
          });
          updateAllocSum();
        }, 50);
      }, 50);
    }
  }, 100);
}

function updateDispatch(i) {
  const name = document.getElementById('mDisName').value.trim();
  const totalPdl = Number(document.getElementById('mDisTotalPdl').value) || 0;
  const checked = [...document.querySelectorAll('.dis-emp-chk:checked')];

  const mode = document.querySelector('input[name="allocMode"]:checked')?.value || 'avg';
  const allocations = [];

  if(mode === 'avg') {
    const each = Math.floor(totalPdl / checked.length);
    const remainder = totalPdl - each * checked.length;
    checked.forEach((c, i) => {
      allocations.push({ empId: c.value, pdl: each + (i < remainder ? 1 : 0) });
    });
  } else {
    let sum = 0;
    document.querySelectorAll('.alloc-input').forEach(inp => {
      const val = Number(inp.value) || 0;
      sum += val;
      allocations.push({ empId: inp.dataset.empId, pdl: val });
    });
    if(sum !== totalPdl) {
      if(!confirm(`已分配合计${sum}，与总派单量${totalPdl}不一致，仍要保存吗？`)) return;
    }
  }

  state.dispatches[i].name = name;
  state.dispatches[i].total_pdl = totalPdl;
  state.dispatches[i].allocations = allocations;
  saveConfig('dispatches', state.dispatches).then(()=>{closeModal();renderDispatches();toast('已更新','success');});
}

function delDispatch(i) {
  if(!confirm('确定删除该派单？')) return;
  state.dispatches.splice(i,1);
  saveConfig('dispatches', state.dispatches).then(()=>{renderDispatches();toast('已删除','success');});
}

// ====== ★ 总看板 ======
function renderDashboard() {
  const p = document.getElementById('panel_dashboard');
  const subs = state.submissions;
  const year = state.dashYear;
  const month = state.dashMonth;
  const ym = `${year}-${String(month).padStart(2,'0')}`;

  const filtered = subs.filter(s => {
    const sMonth = s.month || '';
    const sDate = s.date || '';
    return sMonth === ym || sMonth.startsWith(ym) || sDate.startsWith(ym);
  });

  let total = {pdl:0, cll:0, htl:0, cjl:0, tzjf:0, tsjz:0, count:0};
  filtered.forEach(s => {
    total.pdl += Number(s.pdl)||0;
    total.cll += Number(s.cll)||0;
    total.htl += Number(s.htl)||0;
    total.cjl += Number(s.cjl)||0;
    total.tzjf += Number(s.tzjf)||0;
    total.tsjz += Number(s.tsjz)||0;
    total.count++;
  });
  const htlRate = total.cll > 0 ? (total.htl/total.cll*100).toFixed(1) : '0.0';
  const cjRate = total.pdl > 0 ? (total.cjl/total.pdl*100).toFixed(1) : '0.0';

  const now = new Date();
  let ymHtml = `<div class="ym-selector">
    <select id="dashYear" onchange="state.dashYear=+this.value;renderDashboard()">`;
  for(let y = now.getFullYear()-2; y <= now.getFullYear()+1; y++) {
    ymHtml += `<option value="${y}" ${y===year?'selected':''}>${y}年</option>`;
  }
  ymHtml += `</select><select id="dashMonth" onchange="state.dashMonth=+this.value;renderDashboard()">`;
  for(let m = 1; m <= 12; m++) {
    ymHtml += `<option value="${m}" ${m===month?'selected':''}>${m}月</option>`;
  }
  ymHtml += `</select><span style="font-size:13px;color:var(--text2)">共 ${filtered.length} 条填报</span></div>`;

  let cardsHtml = `<div class="stats-grid">
    <div class="stat-card c1"><div class="label">总派单量</div><div class="value">${total.pdl}</div></div>
    <div class="stat-card c2"><div class="label">总处理量</div><div class="value">${total.cll}</div></div>
    <div class="stat-card c3"><div class="label">总呼通量</div><div class="value">${total.htl}</div></div>
    <div class="stat-card c4"><div class="label">总成交量</div><div class="value">${total.cjl}</div></div>
    <div class="stat-card c5"><div class="label">平均呼通率</div><div class="value">${htlRate}%</div></div>
    <div class="stat-card c6"><div class="label">派单成交转化率</div><div class="value">${cjRate}%</div></div>
  </div>`;

  let trendData = [];
  for(let i = 5; i >= 0; i--) {
    let d = new Date(year, month - 1 - i, 1);
    let ty = d.getFullYear(), tm = d.getMonth() + 1;
    let tym = `${ty}-${String(tm).padStart(2,'0')}`;
    let f = subs.filter(s => {
      const sm = s.month || '';
      const sd = s.date || '';
      return sm === tym || sm.startsWith(tym) || sd.startsWith(tym);
    });
    let t = {pdl:0, cll:0, htl:0, cjl:0, label: `${ty}/${tm}`};
    f.forEach(s => {
      t.pdl += Number(s.pdl)||0; t.cll += Number(s.cll)||0;
      t.htl += Number(s.htl)||0; t.cjl += Number(s.cjl)||0;
    });
    trendData.push(t);
  }

  let chartHtml = `<div class="chart-box"><div style="font-weight:600;margin-bottom:8px">📈 近6月趋势</div>
    <canvas id="trendCanvas" height="260"></canvas></div>`;

  let detailHtml = `<div class="card" style="margin-top:16px"><div class="card-title">📋 派单明细</div>
    <div style="overflow-x:auto"><table class="data-table"><thead><tr>
    <th>派单</th><th>员工</th><th>派单量</th><th>处理量</th><th>呼通量</th><th>呼通率</th><th>成交量</th><th>转化率</th></tr></thead><tbody>`;
  if(filtered.length === 0) {
    detailHtml += '<tr><td colspan="8" class="empty">该月暂无填报数据</td></tr>';
  } else {
    filtered.forEach(s => {
      const hr = Number(s.cll)>0 ? (Number(s.htl)/Number(s.cll)*100).toFixed(1)+'%' : '0%';
      const cr = Number(s.htl)>0 ? (Number(s.cjl)/Number(s.htl)*100).toFixed(1)+'%' : '0%';
      detailHtml += `<tr><td>${s.dispatch_name||'-'}</td><td>${s.emp_name||'-'}</td>
        <td>${s.pdl||0}</td><td>${s.cll||0}</td><td>${s.htl||0}</td><td>${hr}</td><td>${s.cjl||0}</td><td>${cr}</td></tr>`;
    });
  }
  detailHtml += '</tbody></table></div></div>';

  p.innerHTML = ymHtml + cardsHtml + chartHtml + detailHtml;
  setTimeout(() => drawTrendChart(trendData), 50);
}

function drawTrendChart(data) {
  const canvas = document.getElementById('trendCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.parentElement.clientWidth - 32;
  canvas.width = W * 2; canvas.height = 520;
  canvas.style.width = W + 'px'; canvas.style.height = '260px';
  ctx.scale(2,2);
  const padL=50, padR=20, padT=20, padB=40;
  const cw = W - padL - padR, ch = 260 - padT - padB;
  const maxVal = Math.max(1, ...data.map(d=>Math.max(d.pdl,d.cll,d.htl,d.cjl)));
  ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 0.5;
  for(let i=0;i<=4;i++) {
    const y = padT + ch * i / 4;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+cw,y); ctx.stroke();
    ctx.fillStyle='#94a3b8'; ctx.font='10px sans-serif'; ctx.textAlign='right';
    ctx.fillText(Math.round(maxVal*(4-i)/4), padL-8, y+4);
  }
  const gap = cw / (data.length - 1 || 1);
  data.forEach((d,i) => {
    const x = padL + gap * i;
    ctx.fillStyle='#94a3b8'; ctx.font='11px sans-serif'; ctx.textAlign='center';
    ctx.fillText(d.label, x, padT+ch+18);
  });
  const series = [
    {key:'pdl',color:'#4f46e5'},{key:'cll',color:'#06b6d4'},
    {key:'htl',color:'#10b981'},{key:'cjl',color:'#f59e0b'}
  ];
  series.forEach(sr => {
    ctx.strokeStyle = sr.color; ctx.lineWidth = 2; ctx.beginPath();
    data.forEach((d,i) => {
      const x = padL + gap * i;
      const y = padT + ch - (d[sr.key] / maxVal * ch);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
    data.forEach((d,i) => {
      const x = padL + gap * i;
      const y = padT + ch - (d[sr.key] / maxVal * ch);
      ctx.fillStyle = sr.color; ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
    });
  });
  let lx = padL;
  [{l:'派单量',c:'#4f46e5'},{l:'处理量',c:'#06b6d4'},{l:'呼通量',c:'#10b981'},{l:'成交量',c:'#f59e0b'}].forEach(s => {
    ctx.fillStyle = s.c; ctx.fillRect(lx, padT+ch+30,12,3);
    ctx.fillStyle='#64748b'; ctx.font='10px sans-serif'; ctx.textAlign='left';
    ctx.fillText(s.l, lx+16, padT+ch+34);
    lx += 70;
  });
}

function drawRadar(values) {
  const canvas = document.getElementById('radarCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.parentElement.clientWidth - 32;
  canvas.width = W*2; canvas.height = 560;
  canvas.style.width = W+'px'; canvas.style.height = '280px';
  ctx.scale(2,2);
  const cx = W/2, cy = 140, R = Math.min(cx,cy)-30;
  const labels = ['派单量','处理量','呼通量','呼通率','成交量','转化率','积分','提值'];
  const maxV = Math.max(1, ...values);
  const n = labels.length;
  for(let ring=1;ring<=4;ring++) {
    const r = R*ring/4;
    ctx.strokeStyle='#e2e8f0'; ctx.lineWidth=0.5; ctx.beginPath();
    for(let i=0;i<=n;i++) {
      const a = Math.PI*2*i/n - Math.PI/2;
      const x = cx+r*Math.cos(a), y = cy+r*Math.sin(a);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  for(let i=0;i<n;i++) {
    const a = Math.PI*2*i/n - Math.PI/2;
    ctx.strokeStyle='#e2e8f0'; ctx.beginPath();
    ctx.moveTo(cx,cy); ctx.lineTo(cx+R*Math.cos(a), cy+R*Math.sin(a)); ctx.stroke();
    const lx = cx+(R+18)*Math.cos(a), ly = cy+(R+18)*Math.sin(a);
    ctx.fillStyle='#64748b'; ctx.font='11px sans-serif'; ctx.textAlign='center';
    ctx.fillText(labels[i], lx, ly+4);
  }
  ctx.fillStyle='rgba(79,70,229,0.15)'; ctx.strokeStyle='#4f46e5'; ctx.lineWidth=2;
  ctx.beginPath();
  for(let i=0;i<=n;i++) {
    const idx = i%n;
    const a = Math.PI*2*idx/n - Math.PI/2;
    const v = (values[idx]||0)/maxV;
    const x = cx+R*v*Math.cos(a), y = cy+R*v*Math.sin(a);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.fill(); ctx.stroke();
  for(let i=0;i<n;i++) {
    const a = Math.PI*2*i/n - Math.PI/2;
    const v = (values[i]||0)/maxV;
    const x = cx+R*v*Math.cos(a), y = cy+R*v*Math.sin(a);
    ctx.fillStyle='#4f46e5'; ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
  }
}

function drawGroupBar() {
  const canvas = document.getElementById('groupBarCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.parentElement.clientWidth - 32;
  canvas.width = W*2; canvas.height = 400;
  canvas.style.width = W+'px'; canvas.style.height = '200px';
  ctx.scale(2,2);
  const groups = state.groups;
  if(!groups.length) return;
  const data = groups.map(g => {
    const members = state.employees.filter(e => e.group === g.name);
    let t = {pdl:0,cll:0,htl:0,cjl:0};
    members.forEach(emp => {
      state.submissions.filter(s => s.emp_id === emp.id).forEach(s => {
        t.pdl+=Number(s.pdl)||0; t.cll+=Number(s.cll)||0;
        t.htl+=Number(s.htl)||0; t.cjl+=Number(s.cjl)||0;
      });
    });
    return {name: g.name, ...t};
  });
  const padL=40, padR=20, padT=20, padB=40;
  const cw = W-padL-padR, ch = 200-padT-padB;
  const maxVal = Math.max(1, ...data.map(d=>Math.max(d.pdl,d.cll,d.htl,d.cjl)));
  const barW = Math.min(30, cw/groups.length/5);
  const colors = ['#4f46e5','#06b6d4','#10b981','#f59e0b'];
  const keys = ['pdl','cll','htl','cjl'];
  const groupW = cw / groups.length;
  data.forEach((d,gi) => {
    const gx = padL + groupW * gi + groupW/2;
    keys.forEach((k,ki) => {
      const h = d[k]/maxVal*ch;
      const x = gx - barW*2 + ki*barW;
      ctx.fillStyle = colors[ki];
      ctx.fillRect(x, padT+ch-h, barW-1, h);
    });
    ctx.fillStyle='#64748b'; ctx.font='11px sans-serif'; ctx.textAlign='center';
    ctx.fillText(d.name, gx, padT+ch+18);
  });
  let lx = padL;
  ['派单量','处理量','呼通量','成交量'].forEach((l,i) => {
    ctx.fillStyle = colors[i]; ctx.fillRect(lx, padT+ch+28, 12, 3);
    ctx.fillStyle='#64748b'; ctx.font='10px sans-serif'; ctx.textAlign='left';
    ctx.fillText(l, lx+16, padT+ch+32);
    lx += 65;
  });
}

function doExport() {
  const disName = document.getElementById('expDis').value;
  const month = document.getElementById('expMonth').value;
  let subs = state.submissions;
  if(disName) subs = subs.filter(s => s.dispatch_name === disName);
  if(month) subs = subs.filter(s => s.month === month);
  const headers = ['派单名称','员工','派单量','处理量','呼通量','呼通率','成交量','派单转化率','呼通转化率'];
  PRODUCTS.forEach(p => { headers.push(p.name+'数量'); headers.push(p.name+'积分'); });
  headers.push('提值积分','提升价值');
  const rows = subs.map(s => {
    const products = s.products ? (typeof s.products === 'string' ? JSON.parse(s.products) : s.products) : {};
    const hR = Number(s.cll)>0?(Number(s.htl)/Number(s.cll)*100).toFixed(1)+'%':'0%';
    const pdlR = Number(s.pdl)>0?(Number(s.cjl)/Number(s.pdl)*100).toFixed(1)+'%':'0%';
    const htlR = Number(s.htl)>0?(Number(s.cjl)/Number(s.htl)*100).toFixed(1)+'%':'0%';
    const row = [s.dispatch_name||'', s.emp_name||'', s.pdl||0, s.cll||0, s.htl||0, hR, s.cjl||0, pdlR, htlR];
    PRODUCTS.forEach(p => {
      const pr = products[p.key]||{};
      row.push(pr.n||0); row.push(pr.s||0);
    });
    row.push(s.tzjf||0, s.tsjz||0);
    return row;
  });
  let csv = '\uFEFF' + headers.join(',') + '\n';
  rows.forEach(r => { csv += r.map(v=>'"'+v+'"').join(',') + '\n'; });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `派单数据_${disName||'全部'}_${month||'全部'}.csv`;
  a.click();
  toast('导出成功','success');
}

// ====== ★ 员工端（v13.2升级：大小写不敏感+姓名进入）======
async function initEmp() {
  await loadConfig();
  await loadSubmissions();
  const hash = location.hash;
  if(hash.startsWith('#emp=')) {
    const empId = hash.substring(5);
    // 不区分大小写查找
    const emp = state.employees.find(e => e.id.toLowerCase() === empId.toLowerCase());
    if(emp) {
      state.empId = emp.id;
      state.empName = emp.name;
    }
  }
  if(state.empId) {
    const emp = state.employees.find(e => e.id === state.empId);
    if(emp) {
      document.getElementById('empTitle').textContent = emp.name + ' 的填报';
      document.getElementById('empSubtitle').textContent = '工号: ' + emp.id;
    }
  }
  switchEmpTab(0);
}

function switchEmpTab(idx) {
  document.querySelectorAll('.emp-tab').forEach((t,i) => t.classList.toggle('active', i===idx));
  const body = document.getElementById('empBody');
  if(idx === 0) renderEmpForm(body);
  else renderEmpHistory(body);
}

function renderEmpForm(container) {
  const empId = state.empId;
  let html = `<div class="card"><div class="card-title">📝 填写日报</div>`;

  if(!empId) {
    html += `<div class="form-group"><label>工号 或 姓名</label>
      <input id="empInputId" inputmode="text" placeholder="输入工号（如e01/E01）或姓名" style="font-size:16px"></div>
      <button class="btn btn-primary" style="width:100%" onclick="lookupEmp()">确认进入</button></div>`;
    container.innerHTML = html;
    return;
  }

  html += `<div class="form-group"><label>派单</label>
    <select id="empDis" style="font-size:16px">${state.dispatches.map(d=>'<option value="'+d.name+'">'+d.name+'</option>').join('')}</select></div>
    <div class="form-group"><label>日期</label>
    <input type="date" id="empDate" value="${new Date().toISOString().slice(0,10)}" style="font-size:16px"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="form-group"><label>派单量</label><input type="number" id="empPdl" inputmode="numeric" value="0" style="font-size:16px"></div>
      <div class="form-group"><label>处理量</label><input type="number" id="empCll" inputmode="numeric" value="0" style="font-size:16px"></div>
      <div class="form-group"><label>呼通量</label><input type="number" id="empHtl" inputmode="numeric" value="0" style="font-size:16px"></div>
      <div class="form-group"><label>成交量</label><input type="number" id="empCjl" inputmode="numeric" value="0" style="font-size:16px"></div>
    </div>
    <div style="margin:12px 0;font-weight:600">成交产品</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">`;
  PRODUCTS.forEach(p => {
    html += `<div style="padding:8px;border:1px solid var(--border);border-radius:8px">
      <div style="font-size:13px;font-weight:500;margin-bottom:4px">${p.name}</div>
      <input type="number" id="empP_${p.key}_n" inputmode="numeric" value="0" placeholder="数量" style="font-size:16px;width:48%;display:inline">
      <input type="number" id="empP_${p.key}_s" inputmode="numeric" value="0" placeholder="积分" style="font-size:16px;width:48%;display:inline;float:right">
    </div>`;
  });
  html += `</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
      <div class="form-group"><label>提值积分</label><input type="number" id="empTzjf" inputmode="numeric" value="0" style="font-size:16px"></div>
      <div class="form-group"><label>提升价值</label><input type="number" id="empTsjz" inputmode="numeric" value="0" style="font-size:16px"></div>
    </div></div>
  <div style="position:fixed;bottom:0;left:0;right:0;padding:12px;background:#fff;border-top:1px solid var(--border)">
    <button class="btn btn-primary" style="width:100%;padding:14px;font-size:16px" onclick="submitReport()">提交填报</button>
  </div>
  <div style="height:60px"></div>`;
  container.innerHTML = html;
}

function lookupEmp() {
  const input = document.getElementById('empInputId').value.trim();
  if(!input) return toast('请输入工号或姓名','error');

  // 先按工号匹配（不区分大小写）
  let emp = state.employees.find(e => e.id.toLowerCase() === input.toLowerCase());

  // 再按姓名匹配
  if(!emp) {
    emp = state.employees.find(e => e.name === input);
  }

  // 模糊姓名匹配
  if(!emp) {
    emp = state.employees.find(e => e.name.includes(input));
  }

  if(!emp) return toast('未找到该员工，请检查工号或姓名','error');

  state.empId = emp.id;
  state.empName = emp.name;
  document.getElementById('empTitle').textContent = emp.name + ' 的填报';
  document.getElementById('empSubtitle').textContent = '工号: ' + emp.id;
  toast(`欢迎，${emp.name}！`, 'success');
  switchEmpTab(0);
}

async function submitReport() {
  const dis = document.getElementById('empDis')?.value;
  const date = document.getElementById('empDate')?.value;
  if(!dis) return toast('请选择派单','error');
  const pdl = Number(document.getElementById('empPdl')?.value)||0;
  const cll = Number(document.getElementById('empCll')?.value)||0;
  const htl = Number(document.getElementById('empHtl')?.value)||0;
  const cjl = Number(document.getElementById('empCjl')?.value)||0;
  const tzjf = Number(document.getElementById('empTzjf')?.value)||0;
  const tsjz = Number(document.getElementById('empTsjz')?.value)||0;
  const products = {};
  PRODUCTS.forEach(p => {
    const n = Number(document.getElementById('empP_'+p.key+'_n')?.value)||0;
    const s = Number(document.getElementById('empP_'+p.key+'_s')?.value)||0;
    products[p.key] = {n, s};
  });
  const month = date ? date.substring(0,7) : new Date().toISOString().substring(0,7);
  const record = {
    emp_id: state.empId,
    emp_name: state.empName,
    dispatch_name: dis,
    date: date || new Date().toISOString().slice(0,10),
    month: month,
    pdl, cll, htl, cjl,
    products: JSON.stringify(products),
    tzjf, tsjz
  };
  try {
    await apiPost('dispatch_submissions', record);
    toast('提交成功','success');
    PRODUCTS.forEach(p => {
      const nEl = document.getElementById('empP_'+p.key+'_n');
      const sEl = document.getElementById('empP_'+p.key+'_s');
      if(nEl) nEl.value = 0; if(sEl) sEl.value = 0;
    });
    ['empPdl','empCll','empHtl','empCjl','empTzjf','empTsjz'].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.value = 0;
    });
    await loadSubmissions();
  } catch(e) { toast('提交失败: '+e.message, 'error'); }
}

function renderEmpHistory(container) {
  const subs = state.submissions.filter(s => s.emp_id === state.empId);
  let html = `<div class="card"><div class="card-title">📜 填报历史 <span class="badge">${subs.length}条</span></div>`;
  if(!subs.length) {
    html += '<div class="empty">暂无填报记录</div>';
  } else {
    subs.forEach(s => {
      html += `<div style="padding:12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div><strong>${s.dispatch_name||'-'}</strong> <span class="tag tag-dis">${s.date||'-'}</span></div>
          <div>
            <button class="btn btn-sm btn-outline" onclick="editSubmission('${s.id}')">编辑</button>
            <button class="btn btn-sm btn-danger" onclick="delSubmission('${s.id}')">删除</button>
          </div></div>
        <div style="margin-top:8px;font-size:13px;color:var(--text2);display:flex;gap:12px;flex-wrap:wrap">
          <span>派单:${s.pdl||0}</span><span>处理:${s.cll||0}</span>
          <span>呼通:${s.htl||0}</span><span>成交:${s.cjl||0}</span>
          <span>积分:${s.tzjf||0}</span><span>提值:${s.tsjz||0}</span></div></div>`;
    });
  }
  html += '</div>';
  container.innerHTML = html;
}

function editSubmission(id) {
  const s = state.submissions.find(x => x.id === id);
  if(!s) return;
  openModal(`<div class="modal-title">编辑填报</div>
    <div class="form-group"><label>派单量</label><input type="number" id="editPdl" value="${s.pdl||0}"></div>
    <div class="form-group"><label>处理量</label><input type="number" id="editCll" value="${s.cll||0}"></div>
    <div class="form-group"><label>呼通量</label><input type="number" id="editHtl" value="${s.htl||0}"></div>
    <div class="form-group"><label>成交量</label><input type="number" id="editCjl" value="${s.cjl||0}"></div>
    <div class="form-group"><label>提值积分</label><input type="number" id="editTzjf" value="${s.tzjf||0}"></div>
    <div class="form-group"><label>提升价值</label><input type="number" id="editTsjz" value="${s.tsjz||0}"></div>
    <div style="text-align:right;margin-top:16px">
      <button class="btn btn-primary" onclick="saveEditSubmission('${id}')">保存</button>
      <button class="btn btn-outline" onclick="closeModal()" style="margin-left:8px">取消</button>
    </div>`);
}
async function saveEditSubmission(id) {
  const data = {
    pdl: Number(document.getElementById('editPdl').value)||0,
    cll: Number(document.getElementById('editCll').value)||0,
    htl: Number(document.getElementById('editHtl').value)||0,
    cjl: Number(document.getElementById('editCjl').value)||0,
    tzjf: Number(document.getElementById('editTzjf').value)||0,
    tsjz: Number(document.getElementById('editTsjz').value)||0
  };
  try {
    await apiPatch('dispatch_submissions', id, data);
    closeModal(); toast('已更新','success');
    await loadSubmissions();
    switchEmpTab(1);
  } catch(e) { toast('更新失败','error'); }
}
async function delSubmission(id) {
  if(!confirm('确定删除该记录？')) return;
  try {
    await apiDelete('dispatch_submissions', id);
    toast('已删除','success');
    await loadSubmissions();
    switchEmpTab(1);
  } catch(e) { toast('删除失败','error'); }
}

// ====== 初始化 ======
(function init() {
  const hash = location.hash;
  if(hash.startsWith('#emp=')) {
    initEmp();
  }
})();
</script>
