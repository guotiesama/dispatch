<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>派单管控智能体 v13.3</title>
<script src="https://cdn.bootcdn.net/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#4f46e5;--pl:#6366f1;--cyan:#06b6d4;--emerald:#10b981;--amber:#f59e0b;--rose:#f43f5e;--purple:#a855f7;--c6:#7c3aed;--bg:#f8fafc;--card:#fff;--text:#1e293b;--t2:#64748b;--bd:#e2e8f0;--sh:0 1px 3px rgba(0,0,0,.1)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
#entryPage{position:fixed;inset:0;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;overflow:hidden}
#entryPage::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(79,70,229,.3),transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}}
.entry-title{font-size:42px;font-weight:800;background:linear-gradient(135deg,#818cf8,#06b6d4,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;animation:fadeUp .8s ease}
.entry-sub{color:#94a3b8;font-size:16px;margin-bottom:48px;text-align:center;animation:fadeUp .8s ease .2s both}
.entry-cards{display:flex;gap:32px;animation:fadeUp .8s ease .4s both}
.entry-card{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:48px 40px;cursor:pointer;transition:all .3s;text-align:center;min-width:240px}
.entry-card:hover,.entry-card:active{background:rgba(255,255,255,.1);transform:translateY(-4px)}
.entry-card .icon{font-size:48px;margin-bottom:16px}
.entry-card .label{color:#e2e8f0;font-size:20px;font-weight:600}
.entry-card .desc{color:#94a3b8;font-size:13px;margin-top:8px}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
#adminPage{display:none;min-height:100vh}
.top-bar{background:linear-gradient(135deg,var(--primary),var(--c6));color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top-bar h1{font-size:18px;font-weight:700}
.top-bar .back{font-size:13px;cursor:pointer;opacity:.9}
.tab-nav{background:#fff;border-bottom:1px solid var(--bd);padding:0 16px;display:flex;overflow-x:auto;position:sticky;top:56px;z-index:90}
.tab-nav::-webkit-scrollbar{height:0}
.tab-btn{padding:12px 16px;font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab-content{padding:20px;max-width:1400px;margin:0 auto}
.card{background:#fff;border-radius:12px;box-shadow:var(--sh);padding:20px;margin-bottom:16px;border:1px solid var(--bd)}
.card-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.badge{background:linear-gradient(135deg,var(--primary),var(--c6));color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.sc{background:#fff;border-radius:12px;padding:16px;box-shadow:var(--sh);border:1px solid var(--bd);position:relative;overflow:hidden}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.sc.c1::before{background:linear-gradient(90deg,var(--primary),var(--pl))}
.sc.c2::before{background:linear-gradient(90deg,var(--cyan),#22d3ee)}
.sc.c3::before{background:linear-gradient(90deg,var(--emerald),#34d399)}
.sc.c4::before{background:linear-gradient(90deg,var(--amber),#fbbf24)}
.sc.c5::before{background:linear-gradient(90deg,var(--rose),#fb7185)}
.sc.c6::before{background:linear-gradient(90deg,var(--purple),#c084fc)}
.sc .lb{font-size:12px;color:var(--t2);margin-bottom:4px}
.sc .vl{font-size:24px;font-weight:700}
.sc.c1 .vl{color:var(--primary)}.sc.c2 .vl{color:var(--cyan)}.sc.c3 .vl{color:var(--emerald)}.sc.c4 .vl{color:var(--amber)}.sc.c5 .vl{color:var(--rose)}.sc.c6 .vl{color:var(--purple)}
.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{background:#f8fafc;padding:10px 12px;text-align:left;font-weight:600;color:var(--t2);border-bottom:2px solid var(--bd);white-space:nowrap}
.dt td{padding:10px 12px;border-bottom:1px solid var(--bd)}
.dt tr:hover td{background:#f1f5f9}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-p{background:linear-gradient(135deg,var(--primary),var(--c6));color:#fff}
.btn-p:hover{box-shadow:0 4px 12px rgba(79,70,229,.4)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-d{background:var(--rose);color:#fff}
.btn-o{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:13px;font-weight:500;margin-bottom:4px;color:var(--t2)}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;font-size:14px}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center}
.mo.show{display:flex}
.mo-c{background:#fff;border-radius:16px;padding:24px;width:90%;max-width:700px;max-height:85vh;overflow-y:auto;box-shadow:0 25px 50px rgba(0,0,0,.15)}
.mo-t{font-size:18px;font-weight:700;margin-bottom:16px}
.cb{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;border:1px solid var(--bd);box-shadow:var(--sh)}
.cb canvas{width:100%!important;max-height:300px}
.ym{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.ym select{padding:6px 12px;border:1px solid var(--bd);border-radius:8px;font-size:13px}
.cw{display:inline-flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;margin:2px 4px;padding:4px 8px;border:1px solid var(--bd);border-radius:6px}
.cw:has(input:checked){background:rgba(79,70,229,.1);border-color:var(--primary)}
.cw input{accent-color:var(--primary)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.tag-e{background:rgba(79,70,229,.1);color:var(--primary)}
.tag-d{background:rgba(6,182,212,.1);color:var(--cyan)}
#empPage{display:none;min-height:100vh;background:var(--bg)}
.eh{background:linear-gradient(135deg,var(--primary),var(--c6));color:#fff;padding:20px;text-align:center}
.eh h2{font-size:20px;margin-bottom:4px}
.et{display:flex;background:#fff;border-bottom:1px solid var(--bd)}
.et div{flex:1;padding:12px;text-align:center;font-size:14px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:var(--t2)}
.et div.active{color:var(--primary);border-bottom-color:var(--primary)}
.eb{padding:16px;max-width:600px;margin:0 auto}
.ld{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;color:var(--t2)}
.sp{width:32px;height:32px;border:3px solid var(--bd);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.ei{padding:12px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:all .15s}
.ei:active{background:rgba(79,70,229,.06);border-color:var(--primary)}
.err{margin-top:12px;padding:12px;background:#fef2f2;border-radius:8px;border:1px solid #fecaca;color:var(--rose);font-size:13px}
.at{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.at th{background:#f1f5f9;padding:6px 8px;text-align:left;font-size:12px}
.at td{padding:6px 8px;border-bottom:1px solid var(--bd)}
.at input{width:80px;padding:4px 8px;border:1px solid var(--bd);border-radius:6px;font-size:13px;text-align:center}
.at input:focus{outline:none;border-color:var(--primary)}
.rr{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--bd)}
.rn{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.r1{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
.r2{background:linear-gradient(135deg,#94a3b8,#64748b)}
.r3{background:linear-gradient(135deg,#d97706,#b45309)}
.r0{background:#e2e8f0;color:var(--t2)}
.ri{flex:1}
.rb{height:6px;background:#f1f5f9;border-radius:3px;overflow:hidden;margin-top:4px}
.rf{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--primary),var(--cyan))}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
.toast{position:fixed;top:70px;right:20px;background:#1e293b;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;z-index:9999;opacity:0;transform:translateX(20px);transition:all .3s}
.toast.show{opacity:1;transform:translateX(0)}
.toast.ok{background:var(--emerald)}.toast.err{background:var(--rose)}
.empty{text-align:center;padding:40px 20px;color:var(--t2)}
@media(max-width:768px){.entry-cards{flex-direction:column;gap:16px}.entry-card{padding:32px 24px;min-width:auto}.sg{grid-template-columns:repeat(2,1fr)}.tab-btn{padding:10px 12px;font-size:12px}.tab-content{padding:12px}.mo-c{width:95%;padding:16px}.eb{padding:12px}}
</style>
</head>
<body>
<div id="entryPage">
  <div class="entry-title">派单管控智能体</div>
  <div class="entry-sub">电信社区营销 · 数字化管控平台 v13.3</div>
  <div class="entry-cards">
    <div class="entry-card" onclick="goAdmin()"><div class="icon">🛡️</div><div class="label">管理员端</div><div class="desc">数据管控 · 分析决策</div></div>
    <div class="entry-card" onclick="goEmp()"><div class="icon">📱</div><div class="label">员工填报</div><div class="desc">移动填报 · 历史查询</div></div>
  </div>
</div>
<div id="adminPage">
  <div class="top-bar"><h1>📋 派单管控智能体</h1><div class="back" onclick="goEntry()">返回入口</div></div>
  <div class="tab-nav" id="tabNav"></div>
  <div class="tab-content" id="tabContent"></div>
</div>
<div id="empPage">
  <div class="eh"><h2 id="empTitle">员工填报</h2><div id="empSub" style="font-size:13px;opacity:.8"></div></div>
  <div class="et"><div class="active" onclick="empTab(0)">📝 填报</div><div onclick="empTab(1)">📜 历史</div></div>
  <div class="eb" id="empBody"><div class="ld"><div class="sp"></div><div>加载中...</div></div></div>
  <div style="text-align:center;padding:12px;cursor:pointer;color:var(--t2);font-size:13px" onclick="goEntry()">返回入口</div>
</div>
<div class="mo" id="moOv" onclick="if(event.target===this)closeMo()"><div class="mo-c" id="moCt"></div></div>
<div class="toast" id="toast"></div>
<script>
var SU='https://vagtmsyzoehkakdejgkw.supabase.co';
var SK='sb_publishable_O0aq7OG9x4DkuizZ-E4J6w_uuNu30gf';
var HD={'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json','Prefer':'return=representation'};
var PR=[{k:'P_FTTR',n:'FTTR'},{k:'P_ACAP',n:'ACAP'},{k:'P_ZP',n:'中屏'},{k:'P_BZQG',n:'标准迁改'},{k:'P_ZDYQG',n:'自定义迁改'},{k:'P_JZ10U',n:'加装10元以上'},{k:'P_JZ10',n:'加装10元'},{k:'P_TD',n:'托底'}];
var S={emps:[],dis:[],prods:PR.map(function(p){return{k:p.k,n:p.n}}),grps:[],subs:[],tab:'employees',dy:new Date().getFullYear(),dm:new Date().getMonth()+1,eid:'',enm:'',ok:false,err:''};
var TB=[{id:'employees',l:'👥 员工管理'},{id:'dispatches',l:'📋 派单管理'},{id:'products',l:'⭐ 重点业务'},{id:'groups',l:'🏷️ 人员分组'},{id:'dashboard',l:'📊 总看板'},{id:'analysis',l:'🔬 人员分析'},{id:'ranks',l:'🏆 业绩排行'},{id:'qrentry',l:'🔗 填报入口'},{id:'export',l:'📥 数据导出'}];

function toast(m,t){var e=document.getElementById('toast');e.textContent=m;e.className='toast show '+(t||'');setTimeout(function(){e.className='toast'},2500);}
function openMo(h){document.getElementById('moCt').innerHTML=h;document.getElementById('moOv').classList.add('show');}
function closeMo(){document.getElementById('moOv').classList.remove('show');}
function norm(s){return s.trim().replace(/[\uff01-\uff5e]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xfee0)}).replace(/\u3000/g,' ').trim();}
function findE(input){var q=norm(input);if(!q)return null;var e=S.emps.find(function(x){return x.id.toLowerCase()===q.toLowerCase()});if(e)return e;e=S.emps.find(function(x){return x.name===norm(input)});if(e)return e;return S.emps.find(function(x){return x.name.indexOf(norm(input))!==-1})||null;}

// API with detailed error
async function apiG(t,q){var r=await fetch(SU+'/rest/v1/'+t+q,{headers:HD});if(!r.ok){var d='';try{var j=await r.json();d=j.message||j.msg||j.error||JSON.stringify(j);}catch(x){d=r.statusText;}throw new Error(r.status+' '+d);}return r.json();}
async function apiP(t,d){var r=await fetch(SU+'/rest/v1/'+t,{method:'POST',headers:HD,body:JSON.stringify(d)});if(!r.ok&&r.status!==409){var d2='';try{var j2=await r.json();d2=j2.message||j2.msg||j2.error||JSON.stringify(j2);}catch(x){d2=r.statusText;}throw new Error(r.status+' '+d2);}return r.status===409?null:r.json();}
async function apiU(t,id,d){var r=await fetch(SU+'/rest/v1/'+t+'?id=eq.'+id,{method:'PATCH',headers:{...HD,'Prefer':'return=representation'},body:JSON.stringify(d)});if(!r.ok){var d3='';try{var j3=await r.json();d3=j3.message||j3.error||JSON.stringify(j3);}catch(x){d3=r.statusText;}throw new Error(r.status+' '+d3);}return r.json();}
async function apiD(t,id){var r=await fetch(SU+'/rest/v1/'+t+'?id=eq.'+id,{method:'DELETE',headers:HD});if(!r.ok)throw new Error(r.status);}

async function loadCfg(){try{var rows=await apiG('dispatch_config','?select=id,key,data');S.emps=[];S.dis=[];S.prods=PR.map(function(p){return{k:p.k,n:p.n}});S.grps=[];rows.forEach(function(r){if(r.key==='employees')S.emps=r.data||[];if(r.key==='dispatches')S.dis=r.data||[];if(r.key==='products'&&r.data&&r.data.length)S.prods=r.data;if(r.key==='groups')S.grps=r.data||[];});S.ok=true;S.err='';}catch(e){S.ok=false;S.err=e.message;}}
async function loadSubs(){try{S.subs=await apiG('dispatch_submissions','?select=*&order=created_at.desc');}catch(e){S.subs=[];}}
async function saveCfg(key,data){try{var rows=await apiG('dispatch_config','?key=eq.'+key);if(rows.length)await apiU('dispatch_config',rows[0].id,{data:data});else await apiP('dispatch_config',{key:key,data:data});}catch(e){console.error('saveCfg err:',e);}}

function showPg(n){document.getElementById('entryPage').style.display=n==='entry'?'flex':'none';document.getElementById('adminPage').style.display=n==='admin'?'block':'none';document.getElementById('empPage').style.display=n==='emp'?'block':'none';}
function goAdmin(){showPg('admin');initAdm();}
function goEmp(){showPg('emp');initEmp();}
function goEntry(){showPg('entry');S.eid='';S.enm='';}

async function initAdm(){await loadCfg();await loadSubs();renderNav();swTab(S.tab);setInterval(async function(){await loadSubs();if(S.tab==='dashboard')renderDash();if(S.tab==='ranks')renderRanks();},15000);}
function renderNav(){document.getElementById('tabNav').innerHTML=TB.map(function(t){return '<div class="tab-btn '+(t.id===S.tab?'active':'')+'" onclick="swTab(\''+t.id+'\')">'+t.l+'</div>';}).join('');}
function swTab(id){S.tab=id;document.querySelectorAll('.tab-btn').forEach(function(b,i){b.classList.toggle('active',TB[i].id===id);});document.getElementById('tabContent').innerHTML='<div id="p_'+id+'"></div>';var R={employees:rEmps,dispatches:rDis,products:rProds,groups:rGrps,dashboard:rDash,analysis:rAna,ranks:rRanks,qrentry:rQR,export:rExp};if(R[id])R[id]();}

// ========== 员工管理 ==========
function rEmps(){var p=document.getElementById('p_employees');var h='<div class="card"><div class="card-title">👥 员工管理 <span class="badge">'+S.emps.length+'人</span></div><div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"><button class="btn btn-p" onclick="addEmp()">➕ 添加</button><button class="btn btn-o" onclick="batchImp()">📦 批量导入</button></div><div style="overflow-x:auto"><table class="dt"><thead><tr><th>工号</th><th>姓名</th><th>分组</th><th>操作</th></tr></thead><tbody>';S.emps.forEach(function(e,i){h+='<tr><td>'+e.id+'</td><td>'+e.name+'</td><td><span class="tag tag-d">'+(e.group||'未分组')+'</span></td><td><button class="btn btn-sm btn-o" onclick="editEmp('+i+')">编辑</button> <button class="btn btn-sm btn-d" onclick="delEmp('+i+')">删除</button></td></tr>';});if(!S.emps.length)h+='<tr><td colspan="4" class="empty">暂无</td></tr>';h+='</tbody></table></div></div>';p.innerHTML=h;}
function addEmp(){openMo('<div class="mo-t">添加员工</div><div class="fg"><label>工号</label><input id="mId" placeholder="E01"></div><div class="fg"><label>姓名</label><input id="mNm" placeholder="姓名"></div><div class="fg"><label>分组</label><select id="mGr"><option value="">未分组</option>'+S.grps.map(function(g){return '<option value="'+g.name+'">'+g.name+'</option>';}).join('')+'</select></div><div style="text-align:right;margin-top:16px"><button class="btn btn-p" onclick="svEmp()">保存</button> <button class="btn btn-o" onclick="closeMo()">取消</button></div>');}
function svEmp(){var id=document.getElementById('mId').value.trim(),nm=document.getElementById('mNm').value.trim(),gr=document.getElementById('mGr').value;if(!id||!nm)return toast('请填写工号和姓名','err');if(S.emps.find(function(e){return e.id.toLowerCase()===id.toLowerCase()}))return toast('工号已存在','err');S.emps.push({id:id,name:nm,group:gr||''});saveCfg('employees',S.emps).then(function(){closeMo();rEmps();toast('添加成功','ok');});}
function editEmp(i){var e=S.emps[i];openMo('<div class="mo-t">编辑员工</div><div class="fg"><label>工号</label><input value="'+e.id+'" disabled></div><div class="fg"><label>姓名</label><input id="mNm" value="'+e.name+'"></div><div class="fg"><label>分组</label><select id="mGr"><option value="">未分组</option>'+S.grps.map(function(g){return '<option value="'+g.name+'" '+(g.name===e.group?'selected':'')+'>'+g.name+'</option>';}).join('')+'</select></div><div style="text-align:right;margin-top:16px"><button class="btn btn-p" onclick="upEmp('+i+')">保存</button> <button class="btn btn-o" onclick="closeMo()">取消</button></div>');}
function upEmp(i){S.emps[i].name=document.getElementById('mNm').value.trim();S.emps[i].group=document.getElementById('mGr').value;saveCfg('employees',S.emps).then(function(){closeMo();rEmps();toast('已更新','ok');});}
function delEmp(i){if(!confirm('确定删除？'))return;S.emps.splice(i,1);saveCfg('employees',S.emps).then(function(){rEmps();toast('已删除','ok');});}
function batchImp(){openMo('<div class="mo-t">批量导入</div><div class="fg"><label>粘贴数据（每行：工号,姓名,分组）</label><textarea id="mBt" rows="6" placeholder="E01,张三,A组"></textarea></div><div style="text-align:right;margin-top:16px"><button class="btn btn-p" onclick="doImp()">导入</button> <button class="btn btn-o" onclick="closeMo()">取消</button></div>');}
function doImp(){var t=document.getElementById('mBt').value.trim();if(!t)return toast('请输入','err');var c=0;t.split('\n').forEach(function(l){var p=l.split(/[,，\t]/).map(function(s){return s.trim()});if(p.length>=2&&!S.emps.find(function(e){return e.id.toLowerCase()===p[0].toLowerCase()})){S.emps.push({id:p[0],name:p[1],group:p[2]||''});c++;}});saveCfg('employees',S.emps).then(function(){closeMo();rEmps();toast('导入'+c+'人','ok');});}

// ========== 派单管理 ==========

function rDash(){var p=document.getElementById('p_dashboard');var ss=S.subs,yr=S.dy,mo=S.dm;var ym=yr+'-'+(mo<10?'0':'')+mo;var fl=ss.filter(function(s){var sm=s.month||'',sd=s.date||'';return sm===ym||sm.indexOf(ym)===0||sd.indexOf(ym)===0;});var t={pdl:0,cll:0,htl:0,cjl:0};fl.forEach(function(s){t.pdl+=Number(s.pdl)||0;t.cll+=Number(s.cll)||0;t.htl+=Number(s.htl)||0;t.cjl+=Number(s.cjl)||0;});var hr=t.cll>0?(t.htl/t.cll*100).toFixed(1):'0.0',cr=t.pdl>0?(t.cjl/t.pdl*100).toFixed(1):'0.0';var now=new Date();var yh='<div class="ym"><select onchange="S.dy=+this.value;rDash()">';for(var y=now.getFullYear()-2;y<=now.getFullYear()+1;y++)yh+='<option value="'+y+'" '+(y===yr?'selected':'')+'>'+y+'年</option>';yh+='</select><select onchange="S.dm=+this.value;rDash()">';for(var m=1;m<=12;m++)yh+='<option value="'+m+'" '+(m===mo?'selected':'')+'>'+m+'月</option>';yh+='</select><span style="font-size:13px;color:var(--t2)">共'+fl.length+'条</span></div>';var cd='<div class="sg"><div class="sc c1"><div class="lb">总派单量</div><div class="vl">'+t.pdl+'</div></div><div class="sc c2"><div class="lb">总处理量</div><div class="vl">'+t.cll+'</div></div><div class="sc c3"><div class="lb">总呼通量</div><div class="vl">'+t.htl+'</div></div><div class="sc c4"><div class="lb">总成交量</div><div class="vl">'+t.cjl+'</div></div><div class="sc c5"><div class="lb">呼通率</div><div class="vl">'+hr+'%</div></div><div class="sc c6"><div class="lb">成交转化率</div><div class="vl">'+cr+'%</div></div></div>';var td=[];for(var i=5;i>=0;i--){var dd=new Date(yr,mo-1-i,1),ty=dd.getFullYear(),tm=dd.getMonth()+1,tym=ty+'-'+(tm<10?'0':'')+tm;var f=ss.filter(function(s){var sm=s.month||'',sd=s.date||'';return sm===tym||sm.indexOf(tym)===0||sd.indexOf(tym)===0;});var tt={pdl:0,cll:0,htl:0,cjl:0,label:ty+'/'+tm};f.forEach(function(s){tt.pdl+=Number(s.pdl)||0;tt.cll+=Number(s.cll)||0;tt.htl+=Number(s.htl)||0;tt.cjl+=Number(s.cjl)||0;});td.push(tt);}var ch='<div class="cb"><div style="font-weight:600;margin-bottom:8px">📈 近6月趋势</div><canvas id="tCv" height="260"></canvas></div>';var dt='<div class="card"><div class="card-title">📋 明细</div><div style="overflow-x:auto"><table class="dt"><thead><tr><th>派单</th><th>员工</th><th>派单量</th><th>处理量</th><th>呼通量</th><th>呼通率</th><th>成交量</th><th>转化率</th></tr></thead><tbody>';if(!fl.length)dt+='<tr><td colspan="8" class="empty">该月暂无数据</td></tr>';else fl.forEach(function(s){var h1=Number(s.cll)>0?(Number(s.htl)/Number(s.cll)*100).toFixed(1)+'%':'0%';var c1=Number(s.htl)>0?(Number(s.cjl)/Number(s.htl)*100).toFixed(1)+'%':'0%';dt+='<tr><td>'+(s.dispatch_name||'-')+'</td><td>'+(s.emp_name||'-')+'</td><td>'+(s.pdl||0)+'</td><td>'+(s.cll||0)+'</td><td>'+(s.htl||0)+'</td><td>'+h1+'</td><td>'+(s.cjl||0)+'</td><td>'+c1+'</td></tr>';});dt+='</tbody></table></div></div>';p.innerHTML=yh+cd+ch+dt;setTimeout(function(){drawTr(td);},50);}
function drawTr(data){var cv=document.getElementById('tCv');if(!cv)return;var ctx=cv.getContext('2d'),W=cv.parentElement.clientWidth-32;cv.width=W*2;cv.height=520;cv.style.width=W+'px';cv.style.height='260px';ctx.scale(2,2);var pL=50,pR=20,pT=20,pB=40,cw=W-pL-pR,ch=260-pT-pB;var mv=Math.max.apply(null,[1].concat(data.map(function(d){return Math.max(d.pdl,d.cll,d.htl,d.cjl)})));ctx.strokeStyle='#e2e8f0';ctx.lineWidth=.5;for(var i=0;i<=4;i++){var y=pT+ch*i/4;ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(pL+cw,y);ctx.stroke();ctx.fillStyle='#94a3b8';ctx.font='10px sans-serif';ctx.textAlign='right';ctx.fillText(Math.round(mv*(4-i)/4),pL-8,y+4);}var g=cw/(data.length-1||1);data.forEach(function(d,i){ctx.fillStyle='#94a3b8';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText(d.label,pL+g*i,pT+ch+18);});[{k:'pdl',c:'#4f46e5'},{k:'cll',c:'#06b6d4'},{k:'htl',c:'#10b981'},{k:'cjl',c:'#f59e0b'}].forEach(function(sr){ctx.strokeStyle=sr.c;ctx.lineWidth=2;ctx.beginPath();data.forEach(function(d,i){var x=pL+g*i,y=pT+ch-(d[sr.k]/mv*ch);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();data.forEach(function(d,i){var x=pL+g*i,y=pT+ch-(d[sr.k]/mv*ch);ctx.fillStyle=sr.c;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();});});var lx=pL;[{l:'派单量',c:'#4f46e5'},{l:'处理量',c:'#06b6d4'},{l:'呼通量',c:'#10b981'},{l:'成交量',c:'#f59e0b'}].forEach(function(s){ctx.fillStyle=s.c;ctx.fillRect(lx,pT+ch+30,12,3);ctx.fillStyle='#64748b';ctx.font='10px sans-serif';ctx.textAlign='left';ctx.fillText(s.l,lx+16,pT+ch+34);lx+=70;});}

function rAD(){var eid=(document.getElementById('aE')||{}).value||'',mo=(document.getElementById('aM')||{}).value||'',r=document.getElementById('aR');if(!r)return;if(!eid){r.innerHTML='<div class="empty">请选择员工</div>';return;}var ss=S.subs.filter(function(s){return s.emp_id===eid});if(mo)ss=ss.filter(function(s){return s.month===mo});var t={pdl:0,cll:0,htl:0,cjl:0,tzjf:0,tsjz:0};ss.forEach(function(s){t.pdl+=Number(s.pdl)||0;t.cll+=Number(s.cll)||0;t.htl+=Number(s.htl)||0;t.cjl+=Number(s.cjl)||0;t.tzjf+=Number(s.tzjf)||0;t.tsjz+=Number(s.tsjz)||0;});var hr=t.cll>0?(t.htl/t.cll*100).toFixed(1):'0.0',cr=t.pdl>0?(t.cjl/t.pdl*100).toFixed(1):'0.0';var sc=(t.tzjf*0.3+parseFloat(hr)*2+parseFloat(cr)*1.5).toFixed(0);var lv=sc>=50?'优秀':sc>=30?'达标':'待提升';r.innerHTML='<div class="sg"><div class="sc c1"><div class="lb">派单量</div><div class="vl">'+t.pdl+'</div></div><div class="sc c2"><div class="lb">处理量</div><div class="vl">'+t.cll+'</div></div><div class="sc c3"><div class="lb">呼通量</div><div class="vl">'+t.htl+'</div></div><div class="sc c4"><div class="lb">成交量</div><div class="vl">'+t.cjl+'</div></div><div class="sc c5"><div class="lb">呼通率</div><div class="vl">'+hr+'%</div></div><div class="sc c6"><div class="lb">转化率</div><div class="vl">'+cr+'%</div></div></div><div style="text-align:center;padding:12px;background:linear-gradient(135deg,var(--primary),var(--c6));color:#fff;border-radius:12px"><div style="font-size:32px;font-weight:800">'+sc+'分</div><div>综合评分 · '+lv+'</div></div>';}

function rGA(){var r=document.getElementById('gaR');if(!r)return;if(!S.grps.length){r.innerHTML='<div class="empty">请先创建分组</div>';return;}var h='';S.grps.forEach(function(g){var m=S.emps.filter(function(e){return e.group===g.name});var t={pdl:0,cll:0,htl:0,cjl:0,tzjf:0,tsjz:0};m.forEach(function(emp){S.subs.filter(function(s){return s.emp_id===emp.id}).forEach(function(s){t.pdl+=Number(s.pdl)||0;t.cll+=Number(s.cll)||0;t.htl+=Number(s.htl)||0;t.cjl+=Number(s.cjl)||0;t.tzjf+=Number(s.tzjf)||0;t.tsjz+=Number(s.tsjz)||0;});});var hr=t.cll>0?(t.htl/t.cll*100).toFixed(1):'0.0',cr=t.pdl>0?(t.cjl/t.pdl*100).toFixed(1):'0.0';h+='<div style="padding:12px;border:1px solid var(--bd);border-radius:8px;margin-bottom:8px"><b>'+g.name+'</b> <span class="tag tag-e">'+m.length+'人</span><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-top:8px;font-size:13px"><div>派单:<b>'+t.pdl+'</b></div><div>处理:<b>'+t.cll+'</b></div><div>呼通:<b>'+t.htl+'</b></div><div>成交:<b>'+t.cjl+'</b></div><div>呼通率:<b>'+hr+'%</b></div><div>转化率:<b>'+cr+'%</b></div><div>积分:<b>'+t.tzjf+'</b></div><div>提值:<b>'+t.tsjz+'</b></div></div></div>';});r.innerHTML=h;}
function rRanks(){var p=document.getElementById('p_ranks');var sc=S.emps.map(function(emp){var ss=S.subs.filter(function(s){return s.emp_id===emp.id});var t={pdl:0,cll:0,htl:0,cjl:0,tzjf:0};ss.forEach(function(s){t.pdl+=Number(s.pdl)||0;t.cll+=Number(s.cll)||0;t.htl+=Number(s.htl)||0;t.cjl+=Number(s.cjl)||0;t.tzjf+=Number(s.tzjf)||0;});var hr=t.cll>0?t.htl/t.cll*100:0,cr=t.pdl>0?t.cjl/t.pdl*100:0;var s=t.tzjf*0.3+hr*2+cr*1.5;return{emp:emp,s:s.toFixed(0),hr:hr.toFixed(1),cr:cr.toFixed(1),lv:s>=50?'优秀':s>=30?'达标':'待提升'};}).sort(function(a,b){return b.s-a.s;});var ms=Math.max.apply(null,[1].concat(sc.map(function(x){return x.s})));var h='<div class="card"><div class="card-title">🏆 业绩排行</div>';sc.forEach(function(s,i){var rc=i===0?'r1':i===1?'r2':i===2?'r3':'r0';h+='<div class="rr"><div class="rn '+rc+'">'+(i+1)+'</div><div class="ri"><div style="font-weight:600">'+s.emp.name+' <span class="tag tag-d">'+s.emp.id+'</span></div><div style="font-size:13px;color:var(--t2)">综合'+s.s+'分 · '+s.lv+'</div><div class="rb"><div class="rf" style="width:'+s.s/ms*100+'%"></div></div></div></div>';});if(!sc.length)h+='<div class="empty">暂无</div>';h+='</div>';p.innerHTML=h;}
function rQR(){var p=document.getElementById('p_qrentry');var bu=location.origin+location.pathname;var h='<div class="card"><div class="card-title">🔗 填报入口</div><p style="color:var(--t2);font-size:13px;margin-bottom:16px">支持工号或姓名进入</p>';S.emps.forEach(function(e){var lk=bu+'#emp='+e.id;h+='<div style="padding:12px;border:1px solid var(--bd);border-radius:8px;margin-bottom:8px;display:flex;align-items:center;gap:16px;flex-wrap:wrap"><div id="qr_'+e.id+'" style="flex-shrink:0"></div><div style="flex:1;min-width:200px"><div style="font-weight:600">'+e.name+' <span class="tag tag-e">'+e.id+'</span></div><div style="margin-top:4px;font-size:12px;color:var(--primary);word-break:break-all">'+lk+'</div></div></div>';});if(!S.emps.length)h+='<div class="empty">请先添加员工</div>';h+='</div>';p.innerHTML=h;S.emps.forEach(function(e){var c=document.getElementById('qr_'+e.id);if(c&&!c.hasChildNodes()){try{new QRCode(c,{text:bu+'#emp='+e.id,width:80,height:80,colorDark:'#1e293b',colorLight:'#fff'});}catch(x){c.textContent='QR';}}});}
function rExp(){var p=document.getElementById('p_export');var aM=[].concat(new Set(S.subs.map(function(s){return s.month}).filter(Boolean))).sort().reverse();p.innerHTML='<div class="card"><div class="card-title">📥 数据导出</div><div style="display:flex;gap:8px;flex-wrap:wrap"><select id="eD"><option value="">全部派单</option>'+S.dis.map(function(d){return '<option value="'+d.name+'">'+d.name+'</option>';}).join('')+'</select><select id="eM"><option value="">全部月份</option>'+aM.map(function(m){return '<option value="'+m+'">'+m+'</option>';}).join('')+'</select><button class="btn btn-p" onclick="doExp()">导出CSV</button></div></div>';}
function doExp(){var dn=document.getElementById('eD').value,mo=document.getElementById('eM').value;var ss=S.subs;if(dn)ss=ss.filter(function(s){return s.dispatch_name===dn});if(mo)ss=ss.filter(function(s){return s.month===mo});var hd=['派单名称','员工','派单量','处理量','呼通量','呼通率','成交量','派单转化率','呼通转化率'];PR.forEach(function(p){hd.push(p.n+'数量');hd.push(p.n+'积分');});hd.push('提值积分','提升价值');var rows=ss.map(function(s){var pr=s.products?(typeof s.products==='string'?JSON.parse(s.products):s.products):{};var hR=Number(s.cll)>0?(Number(s.htl)/Number(s.cll)*100).toFixed(1)+'%':'0%';var pR=Number(s.pdl)>0?(Number(s.cjl)/Number(s.pdl)*100).toFixed(1)+'%':'0%';var hR2=Number(s.htl)>0?(Number(s.cjl)/Number(s.htl)*100).toFixed(1)+'%':'0%';var r=[s.dispatch_name||'',s.emp_name||'',s.pdl||0,s.cll||0,s.htl||0,hR,s.cjl||0,pR,hR2];PR.forEach(function(p){var d=pr[p.k]||{};r.push(d.n||0);r.push(d.s||0);});r.push(s.tzjf||0,s.tsjz||0);return r;});var csv='\uFEFF'+hd.join(',')+'\n';rows.forEach(function(r){csv+=r.map(function(v){return '"'+v+'"'}).join(',')+'\n';});var b=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='派单数据.csv';a.click();toast('导出成功','ok');}

async function initEmp(){var body=document.getElementById('empBody');body.innerHTML='<div class="ld"><div class="sp"></div><div>加载中...</div></div>';if(!S.ok){try{await loadCfg();await loadSubs();}catch(e){S.err=e.message;}}var hash=location.hash;if(hash&&hash.indexOf('#emp=')===0){var raw=decodeURIComponent(hash.substring(5));var emp=S.emps.find(function(e){return e.id.toLowerCase()===raw.toLowerCase()});if(emp){S.eid=emp.id;S.enm=emp.name;}}if(S.eid){var em=S.emps.find(function(e){return e.id===S.eid});if(em){document.getElementById('empTitle').textContent=em.name+' 的填报';document.getElementById('empSub').textContent='工号: '+em.id;}}empTab(0);}
function empTab(i){document.querySelectorAll('.et div').forEach(function(t,j){t.classList.toggle('active',j===i);});var body=document.getElementById('empBody');if(i===0)rEF(body);else rEH(body);}
function rEF(ct){if(S.err&&!S.emps.length){ct.innerHTML='<div class="card"><div class="err"><div style="font-weight:600;margin-bottom:8px">数据加载失败</div><div>'+S.err+'</div><div style="margin-top:12px"><button class="btn btn-p" onclick="initEmp()">重新加载</button></div></div></div>';return;}if(S.ok&&!S.emps.length){ct.innerHTML='<div class="card"><div class="empty">暂无员工数据，请联系管理员</div></div>';return;}if(S.eid){rEFF(ct);return;}var h='<div class="card"><div class="card-title">📝 员工身份验证</div><div class="fg"><label>输入工号或姓名</label><input id="eIn" inputmode="text" placeholder="如 e01、E01 或 张三" style="font-size:16px" onkeydown="if(event.key===\'Enter\')lookE()"></div><button class="btn btn-p" style="width:100%;padding:14px;font-size:16px" onclick="lookE()">确认进入</button><div id="eSR"></div></div>';h+='<div class="card" style="margin-top:12px"><div style="font-size:13px;color:var(--t2);margin-bottom:8px">或直接点击：</div>';S.emps.forEach(function(e){h+='<div class="ei" onclick="selE(\''+e.id+'\')"><div><span style="font-weight:600">'+e.name+'</span> <span class="tag tag-e">'+e.id+'</span></div><div style="font-size:12px;color:var(--t2)">点击进入</div></div>';});h+='</div>';ct.innerHTML=h;}
function selE(id){var e=S.emps.find(function(x){return x.id===id});if(!e)return;S.eid=e.id;S.enm=e.name;document.getElementById('empTitle').textContent=e.name+' 的填报';document.getElementById('empSub').textContent='工号: '+e.id;toast('欢迎，'+e.name+'！','ok');empTab(0);}
function lookE(){var inp=document.getElementById('eIn');if(!inp)return;var v=inp.value;if(!v||!v.trim())return toast('请输入工号或姓名','err');var e=findE(v);if(!e){var sr=document.getElementById('eSR');if(sr){var h='<div class="err" style="margin-top:12px"><div style="font-weight:600;margin-bottom:8px">未找到: "'+v+'"</div><div>当前员工列表：</div></div>';S.emps.forEach(function(x){h+='<div class="ei" onclick="selE(\''+x.id+'\')"><div><span style="font-weight:600">'+x.name+'</span> <span class="tag tag-e">'+x.id+'</span></div><div style="font-size:12px;color:var(--t2)">点击选择</div></div>';});sr.innerHTML=h;}toast('未找到匹配员工','err');return;}S.eid=e.id;S.enm=e.name;document.getElementById('empTitle').textContent=e.name+' 的填报';document.getElementById('empSub').textContent='工号: '+e.id;toast('欢迎，'+e.name+'！','ok');empTab(0);}
function rEFF(ct){var h='<div class="card"><div class="card-title">📝 填写日报</div><div class="fg"><label>派单</label><select id="eD" style="font-size:16px">';S.dis.forEach(function(d){h+='<option value="'+d.name+'">'+d.name+'</option>';});h+='</select></div><div class="fg"><label>日期</label><input type="date" id="eDt" value="'+new Date().toISOString().slice(0,10)+'" style="font-size:16px"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="fg"><label>派单量</label><input type="number" id="ePdl" inputmode="numeric" value="0" style="font-size:16px"></div><div class="fg"><label>处理量</label><input type="number" id="eCll" inputmode="numeric" value="0" style="font-size:16px"></div><div class="fg"><label>呼通量</label><input type="number" id="eHtl" inputmode="numeric" value="0" style="font-size:16px"></div><div class="fg"><label>成交量</label><input type="number" id="eCjl" inputmode="numeric" value="0" style="font-size:16px"></div></div><div style="margin:12px 0;font-weight:600">成交产品</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';PR.forEach(function(p){h+='<div style="padding:8px;border:1px solid var(--bd);border-radius:8px"><div style="font-size:13px;font-weight:500;margin-bottom:4px">'+p.n+'</div><input type="number" id="ep_'+p.k+'_n" inputmode="numeric" value="0" placeholder="数量" style="font-size:16px;width:48%;display:inline"><input type="number" id="ep_'+p.k+'_s" inputmode="numeric" value="0" placeholder="积分" style="font-size:16px;width:48%;display:inline;float:right"></div>';});h+='</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><div class="fg"><label>提值积分</label><input type="number" id="eTz" inputmode="numeric" value="0" style="font-size:16px"></div><div class="fg"><label>提升价值</label><input type="number" id="eTs" inputmode="numeric" value="0" style="font-size:16px"></div></div></div><div style="position:fixed;bottom:0;left:0;right:0;padding:12px;background:#fff;border-top:1px solid var(--bd);z-index:50"><button class="btn btn-p" style="width:100%;padding:14px;font-size:16px" onclick="subR()">提交填报</button></div><div style="height:60px"></div>';ct.innerHTML=h;}
async function subR(){var dis=(document.getElementById('eD')||{}).value||'',dt=(document.getElementById('eDt')||{}).value||'';if(!dis)return toast('请选择派单','err');var pdl=Number((document.getElementById('ePdl')||{}).value)||0,cll=Number((document.getElementById('eCll')||{}).value)||0,htl=Number((document.getElementById('eHtl')||{}).value)||0,cjl=Number((document.getElementById('eCjl')||{}).value)||0,tz=Number((document.getElementById('eTz')||{}).value)||0,ts=Number((document.getElementById('eTs')||{}).value)||0;var pr={};PR.forEach(function(p){var n=Number((document.getElementById('ep_'+p.k+'_n')||{}).value)||0;var s=Number((document.getElementById('ep_'+p.k+'_s')||{}).value)||0;pr[p.k]={n:n,s:s};});var mo=dt?dt.substring(0,7):new Date().toISOString().substring(0,7);try{await apiP('dispatch_submissions',{emp_id:S.eid,emp_name:S.enm,dispatch_name:dis,date:dt||new Date().toISOString().slice(0,10),month:mo,pdl:pdl,cll:cll,htl:htl,cjl:cjl,products:pr,tzjf:tz,tsjz:ts});toast('提交成功','ok');PR.forEach(function(p){var ne=document.getElementById('ep_'+p.k+'_n');var se=document.getElementById('ep_'+p.k+'_s');if(ne)ne.value=0;if(se)se.value=0;});['ePdl','eCll','eHtl','eCjl','eTz','eTs'].forEach(function(id){var el=document.getElementById(id);if(el)el.value=0;});await loadSubs();}catch(e){toast('提交失败: '+e.message,'err');}}
function rEH(ct){if(!S.eid){ct.innerHTML='<div class="card"><div class="empty">请先验证身份</div></div>';return;}var ss=S.subs.filter(function(s){return s.emp_id===S.eid});var h='<div class="card"><div class="card-title">📜 填报历史 <span class="badge">'+ss.length+'条</span></div>';if(!ss.length)h+='<div class="empty">暂无记录</div>';else ss.forEach(function(s){h+='<div style="padding:12px;border:1px solid var(--bd);border-radius:8px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>'+(s.dispatch_name||'-')+'</b> <span class="tag tag-d">'+(s.date||'-')+'</span></div><div><button class="btn btn-sm btn-o" onclick="edSub(\''+s.id+'\')">编辑</button> <button class="btn btn-sm btn-d" onclick="dlSub(\''+s.id+'\')">删除</button></div></div><div style="margin-top:8px;font-size:13px;color:var(--t2)">派单:'+((s.pdl||0))+' 处理:'+((s.cll||0))+' 呼通:'+((s.htl||0))+' 成交:'+((s.cjl||0))+'</div></div>';});h+='</div>';ct.innerHTML=h;}
function edSub(id){var s=S.subs.find(function(x){return x.id===id});if(!s)return;openMo('<div class="mo-t">编辑</div><div class="fg"><label>派单量</label><input type="number" id="edPdl" value="'+(s.pdl||0)+'"></div><div class="fg"><label>处理量</label><input type="number" id="edCll" value="'+(s.cll||0)+'"></div><div class="fg"><label>呼通量</label><input type="number" id="edHtl" value="'+(s.htl||0)+'"></div><div class="fg"><label>成交量</label><input type="number" id="edCjl" value="'+(s.cjl||0)+'"></div><div class="fg"><label>提值积分</label><input type="number" id="edTz" value="'+(s.tzjf||0)+'"></div><div class="fg"><label>提升价值</label><input type="number" id="edTs" value="'+(s.tsjz||0)+'"></div><div style="text-align:right;margin-top:16px"><button class="btn btn-p" onclick="svEd(\''+id+'\')">保存</button> <button class="btn btn-o" onclick="closeMo()">取消</button></div>');}
async function svEd(id){try{await apiU('dispatch_submissions',id,{pdl:Number(document.getElementById('edPdl').value)||0,cll:Number(document.getElementById('edCll').value)||0,htl:Number(document.getElementById('edHtl').value)||0,cjl:Number(document.getElementById('edCjl').value)||0,tzjf:Number(document.getElementById('edTz').value)||0,tsjz:Number(document.getElementById('edTs').value)||0});closeMo();toast('已更新','ok');await loadSubs();empTab(1);}catch(e){toast('更新失败','err');}}
async function dlSub(id){if(!confirm('确定删除？'))return;try{await apiD('dispatch_submissions',id);toast('已删除','ok');await loadSubs();empTab(1);}catch(e){toast('删除失败','err');}}
